<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CampusChat</title>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #e9edef;
    color: #111b21;
}

button, input { font: inherit; }
button {
    border: 0;
    border-radius: 6px;
    padding: 12px;
    background: #128c7e;
    color: white;
    cursor: pointer;
}
button:hover { background: #075e54; }
input {
    padding: 12px;
    border: 1px solid #ccd3d7;
    border-radius: 6px;
    min-width: 0;
}
[hidden] { display: none !important; }

/* Login and registration */
#authView {
    width: min(380px, 92%);
    margin: 10vh auto;
    padding: 28px;
    background: white;
    border-radius: 12px;
    box-shadow: 0 5px 25px #0001;
}
h1 { color: #075e54; }
#authView input {
    width: 100%;
    margin: 7px 0;
}
.auth-buttons {
    display: flex;
    gap: 8px;
    margin-top: 12px;
}
.auth-buttons button { flex: 1; }
#authStatus { color: #b42318; font-size: 14px; }

/* Main chat */
.app {
    display: grid;
    grid-template-columns: 300px 1fr;
    height: 100vh;
    max-width: 1250px;
    margin: auto;
    background: white;
}
.sidebar {
    min-width: 0;
    display: flex;
    flex-direction: column;
    border-right: 1px solid #ddd;
}
.topbar, .chat-header {
    padding: 16px;
    background: #f0f2f5;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
}
.topbar strong { color: #075e54; font-size: 20px; }
#connectionStatus { font-size: 12px; color: #667781; }
#logoutButton { padding: 8px; }

.new-chat {
    display: flex;
    gap: 6px;
    padding: 10px;
}
.new-chat input { width: 100%; }

.new-group {
    display: flex;
    flex-direction: column;
    gap: 7px;
    padding: 10px;
    border-bottom: 1px solid #ddd;
}

.section-title {
    padding: 10px;
    font-size: 11px;
    font-weight: bold;
    color: #667781;
}

.groups-list {
    max-height: 150px;
    overflow-y: auto;
}

.groups-list .contact {
    padding: 10px 15px;
}

.contacts { flex: 1; overflow-y: auto; }

.contact {
    display: block;
    width: 100%;
    background: white;
    color: #111b21;
    text-align: left;
    border-radius: 0;
    border-bottom: 1px solid #eee;
    padding: 15px;
}
.contact.active { background: #e9edef; }
.contact-name { font-weight: bold; margin-bottom: 6px; }
.preview {
    color: #667781;
    font-size: 13px;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
}

.chat {
    min-width: 0;
    display: flex;
    flex-direction: column;
}
.chat-header {
    min-height: 65px;
    justify-content: flex-start;
    font-weight: bold;
}
.messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    background: #efeae2;
    display: flex;
    flex-direction: column;
    gap: 10px;
}
.empty { margin: auto; color: #667781; text-align: center; }

.message-row { display: flex; }
.message-row.mine { justify-content: flex-end; }
.bubble {
    background: white;
    border-radius: 8px;
    padding: 10px 13px;
    max-width: 75%;
    overflow-wrap: anywhere;
}
.bubble.mine { background: #d9fdd3; }
.author {
    font-size: 12px;
    font-weight: bold;
    color: #075e54;
    margin-bottom: 4px;
}
.message-time {
    display: block;
    text-align: right;
    font-size: 11px;
    color: #667781;
    margin-top: 5px;
}
.image-lightbox {
    position: fixed;
    inset: 0;
    z-index: 9999;
    background: rgba(0, 0, 0, 0.88);
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 30px;
    cursor: default;
}

.image-lightbox img {
    max-width: 95%;
    max-height: 90vh;
    object-fit: contain;
    border-radius: 8px;
    cursor: default;
}

.image-lightbox button {
    position: absolute;
    top: 15px;
    right: 20px;
    font-size: 24px;
    cursor: pointer;
}
.chat-input {
    display: flex;
    gap: 8px;
    padding: 12px;
    background: #f0f2f5;
}
.chat-input input { flex: 1; }
button:disabled { opacity: .5; cursor: not-allowed; }

@media(max-width: 600px) {
    .app { grid-template-columns: 125px 1fr; }
    .topbar { padding: 8px 4px; flex-wrap: wrap; }
    .topbar strong { font-size: 15px; }
    #logoutButton { font-size: 11px; padding: 6px; }
    .new-chat { padding: 5px; flex-direction: column; }
    .contact { padding: 10px 5px; }
    .messages { padding: 10px; }
}
</style>
</head>

<body>

<!-- Login / register screen -->
<section id="authView">
    <h1>CampusChat</h1>
    <p>Connect with your campus community.</p>

    <input id="authUsername" placeholder="Username"
           autocomplete="username" maxlength="24">

    <input id="authPassword" type="password"
           placeholder="Password (minimum 8 characters)"
           autocomplete="current-password">

    <div class="auth-buttons">
        <button onclick="authenticate('login')">Login</button>
        <button onclick="authenticate('register')">Register</button>
    </div>

    <p id="authStatus" role="status"></p>
</section>

<!-- Authenticated chat screen -->
<div id="chatView" class="app" hidden>

    <aside class="sidebar">
        <div class="topbar">
            <strong>CampusChat</strong>
            <button id="logoutButton" onclick="logout()">Logout</button>
            <span id="connectionStatus">Connecting...</span>
        </div>

        <div style="padding:10px">
            Logged in as <b id="meName"></b>
        </div>

        <div class="new-chat">
            <input id="newContact" placeholder="Username to chat with">
            <button onclick="startChat()">+</button>
        </div>

        <div class="section-title">GROUP CHATS</div>

<div class="new-group">
    <input id="newGroupName" placeholder="Group name">

    <input id="groupMembers"
           placeholder="Member usernames, comma-separated">

    <button onclick="createGroup()">＋ Create Group</button>
</div>

<div id="groups" class="groups-list">
    <p class="empty">No groups yet.</p>
</div>

<div class="section-title">PRIVATE CHATS</div>

        <div id="contacts" class="contacts">
            <p class="empty">No conversations yet.</p>
        </div>
    </aside>

    <main class="chat">
        <div id="chatHeader" class="chat-header">
            Select a conversation
        </div>

        <div id="messages" class="messages">
            <p class="empty">Choose a person to start chatting.</p>
        </div>

        <div class="chat-input">
    <input id="message"
           placeholder="Type a message..."
           onkeydown="handleEnter(event)"
           disabled>

    <input id="imageFile"
           type="file"
           accept="image/jpeg,image/png,image/webp,image/gif"
           hidden
           onchange="sendImage()">

    <button type="button"
            onclick="$('imageFile').click()"
            id="imageButton"
            disabled>📷 Image</button>

    <button id="sendButton"
            onclick="sendMessage()"
            disabled>Send</button>
</div>

<script>
let socket = null;
let username = "";
let selectedContact = "";
let historyMessages = [];
let contacts = [];
let unread = {};
let groups = [];
let selectedGroup = null;
let groupMessages = [];

const $ = id => document.getElementById(id);

async function authenticate(action) {
    const user = $("authUsername").value.trim();
    const password = $("authPassword").value;

    $("authStatus").textContent = "Please wait...";

    try {
        const response = await fetch(`/api/${action}`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username: user, password })
        });

        const data = await response.json();

        if (!response.ok) throw new Error(data.detail || "Authentication failed.");

        $("authStatus").textContent = "";
        enterChat(data.username);

    } catch (error) {
        $("authStatus").textContent = error.message;
    }
}

function enterChat(user) {
    username = user;
    historyMessages = [];
    contacts = [];
    unread = {};
    selectedContact = "";

    $("authView").hidden = true;
    $("chatView").hidden = false;
    $("meName").textContent = username;

    connectSocket();
}

function connectSocket() {
    if (socket) socket.close();

    const protocol = location.protocol === "https:" ? "wss:" : "ws:";
    socket = new WebSocket(`${protocol}//${location.host}/ws`);

    $("connectionStatus").textContent = "Connecting...";

    socket.onopen = () => {
        $("connectionStatus").textContent = "Online";
        updateInputState();
        loadGroups();
    };

    socket.onclose = () => {
        $("connectionStatus").textContent = "Offline";
        updateInputState();
    };

    socket.onerror = () => {
        $("connectionStatus").textContent = "Connection error";
    };

    socket.onmessage = event => {
        const data = JSON.parse(event.data);

        if (data.type === "error") {
            alert(data.message);
            return;
        }

        if (data.type === "history") {
            historyMessages = data.messages || [];
            contacts = [];

            historyMessages.forEach(message => {
                const other = message.sender === username
                    ? message.recipient : message.sender;
                addContact(other);
            });

            renderContacts();

            if (contacts.length) {
                selectContact(contacts[0]);
            } else {
                renderMessages();
            }
            return;
        }
        if (data.type === "deleted") {
            if (data.group_id !== undefined) {
                groupMessages = groupMessages.filter(
                    message => Number(message.id) !== Number(data.id)
                );

                if (
                    selectedGroup &&
                    Number(selectedGroup.id) === Number(data.group_id)
                ) {
                    renderGroupMessages();
                }
            } else {
                historyMessages = historyMessages.filter(
                    message => Number(message.id) !== Number(data.id)
                );
                renderMessages();
            }

            renderContacts();
            return;
        }

        if (data.type === "group_message") {
            if (selectedGroup && data.group_id === selectedGroup.id) {
                groupMessages.push(data);
                renderGroupMessages();
            }
            return;
        }

        if (data.type === "message") {
            historyMessages.push(data);

            const other = data.sender === username
                ? data.recipient : data.sender;

            addContact(other);

            if (selectedContact === other) {
                renderMessages();
            } else {
                unread[other] = (unread[other] || 0) + 1;
            }

            renderContacts();
        }
    };
}

function addContact(name) {
    if (!name || name === username) return;
    contacts = contacts.filter(item => item !== name);
    contacts.unshift(name);
}

async function loadGroups() {
    try {
        const response = await fetch("/api/groups");
        if (!response.ok) return;

        groups = await response.json();
        renderGroups();
    } catch (error) {
        console.error("Could not load groups:", error);
    }
}

function renderGroups() {
    const container = $("groups");
    container.replaceChildren();

    if (groups.length === 0) {
        const p = document.createElement("p");
        p.className = "empty";
        p.textContent = "No groups yet.";
        container.appendChild(p);
        return;
    }

    groups.forEach(group => {
        const button = document.createElement("button");
        button.className = "contact" +
            (selectedGroup?.id === group.id ? " active" : "");

        const title = document.createElement("div");
        title.className = "contact-name";
        title.textContent = "👥 " + group.name;

        button.appendChild(title);
        button.onclick = () => selectGroup(group.id, group.name);

        container.appendChild(button);
    });
}

async function createGroup() {
    const name = $("newGroupName").value.trim();
    const members = $("groupMembers").value
        .split(",")
        .map(member => member.trim().toLowerCase())
        .filter(Boolean);

    if (!name) {
        alert("Enter a group name.");
        return;
    }

    try {
        const response = await fetch("/api/groups", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ name, members })
        });

        const data = await response.json();

        if (!response.ok) {
            alert(data.detail || "Could not create group.");
            return;
        }

        $("newGroupName").value = "";
        $("groupMembers").value = "";

        await loadGroups();
        selectGroup(data.id, data.name);

    } catch (error) {
        alert("Could not create group. Check your connection.");
    }
}

async function selectGroup(id, name) {
    selectedGroup = { id, name };
    selectedContact = "";
    groupMessages = [];

    $("chatHeader").textContent = "👥 " + name;
    renderGroups();
    renderContacts();
    updateInputState();

    const container = $("messages");
    container.replaceChildren();

    const loading = document.createElement("p");
    loading.className = "empty";
    loading.textContent = "Loading group messages...";
    container.appendChild(loading);

    try {
        const response = await fetch(`/api/groups/${id}/messages`);

        if (!response.ok) {
            throw new Error("Could not load group messages.");
        }

        groupMessages = await response.json();
        renderGroupMessages();
    } catch (error) {
        container.replaceChildren();
        showEmpty("Could not load group messages. Please try again.");
    }
}

function startChat() {
    const name = $("newContact").value.trim().toLowerCase();

    if (!socket || socket.readyState !== WebSocket.OPEN) {
        alert("Please wait for the connection.");
        return;
    }

    if (!name || name === username) {
        alert("Enter another user's username.");
        return;
    }

    addContact(name);
    $("newContact").value = "";
    renderContacts();
    selectContact(name);
}

function selectContact(name) {
    selectedGroup = null;
    selectedContact = name;
    unread[name] = 0;

    $("chatHeader").textContent = name;
    renderGroups();
    renderContacts();
    renderMessages();
    updateInputState();
}

function renderContacts() {
    const container = $("contacts");
    container.replaceChildren();

    if (!contacts.length) {
        const p = document.createElement("p");
        p.className = "empty";
        p.textContent = "No conversations yet. Start one above.";
        container.appendChild(p);
        return;
    }

    contacts.forEach(name => {
        const button = document.createElement("button");
        button.className = "contact" +
            (name === selectedContact ? " active" : "");
        button.onclick = () => selectContact(name);

        const title = document.createElement("div");
        title.className = "contact-name";
        title.textContent = name +
            (unread[name] ? ` (${unread[name]})` : "");

        const last = [...historyMessages].reverse().find(message =>
            (message.sender === username && message.recipient === name) ||
            (message.sender === name && message.recipient === username)
        );

        const preview = document.createElement("div");
        preview.className = "preview";
        preview.textContent = last
            ? (last.sender === username ? "You: " : "") + last.message
            : "Start a conversation";

        button.append(title, preview);
        container.appendChild(button);
    });
}

function openImage(src) {
    const overlay = document.createElement("div");
    overlay.className = "image-lightbox";

    const image = document.createElement("img");
    image.src = src;
    image.alt = "Enlarged image";
    image.onclick = event => event.stopPropagation();

    const close = document.createElement("button");
    close.textContent = "✕";
    close.setAttribute("aria-label", "Close image");
    close.onclick = () => overlay.remove();

    overlay.append(image, close);
    overlay.onclick = () => overlay.remove();

    document.body.appendChild(overlay);

    function handleEscape(event) {
        if (event.key === "Escape") {
            overlay.remove();
            document.removeEventListener("keydown", handleEscape);
        }
    }

    document.addEventListener("keydown", handleEscape);
}

function renderGroupMessages() {
    const container = $("messages");
    container.replaceChildren();

    if (!selectedGroup) return;

    if (groupMessages.length === 0) {
        showEmpty("No messages yet. Say hello to your group!");
        return;
    }

    groupMessages.forEach(message => {
        const mine = message.sender === username;

        const row = document.createElement("div");
        row.className = "message-row" + (mine ? " mine" : "");

        const bubble = document.createElement("div");
        bubble.className = "bubble" + (mine ? " mine" : "");

        const author = document.createElement("div");
        author.className = "author";
        author.textContent = mine ? "You" : message.sender;

        const text = document.createElement("div");

if (message.message_type === "image") {
    const img = document.createElement("img");
    img.src = message.message;
    img.alt = "Shared image";
    img.style.maxWidth = "260px";
    img.style.maxHeight = "260px";
    img.style.borderRadius = "8px";
    img.style.cursor = "zoom-in";
    img.onclick = () => openImage(message.message);
    text.appendChild(img);
} else {
    text.textContent = message.message;
}

        const time = document.createElement("span");
        time.className = "message-time";

        if (message.timestamp) {
            const date = new Date(
                message.timestamp.replace(" ", "T") + "Z"
            );

            if (!Number.isNaN(date.getTime())) {
                time.textContent = date.toLocaleTimeString([], {
                    hour: "2-digit",
                    minute: "2-digit"
                });
            }
        }

        const deleteButton = document.createElement("button");
deleteButton.textContent = "🗑️";
deleteButton.title = "Delete message";
deleteButton.style.cssText =
    "background:transparent;color:#667781;padding:4px;margin-top:5px;";

deleteButton.onclick = () => {
    const choice = prompt(
        "Type 'me' to delete for yourself, or 'everyone' to delete for everyone (your own messages only)."
    ).trim().toLowerCase();

    if (choice !== "me" && choice !== "everyone") return;

    socket.send(JSON.stringify({
        action: "delete_group_message",
        group_id: selectedGroup.id,
        id: message.id,
        scope: choice
    }));
};

bubble.append(author, text, time, deleteButton);
        row.appendChild(bubble);
        container.appendChild(row);
    });

    container.scrollTop = container.scrollHeight;
}

function renderMessages() {
    const container = $("messages");
    container.replaceChildren();

    if (!selectedContact) {
        showEmpty("Choose a person from the list to chat.");
        return;
    }

    const conversation = historyMessages.filter(message =>
        (message.sender === username &&
         message.recipient === selectedContact) ||
        (message.sender === selectedContact &&
         message.recipient === username)
    );

    if (!conversation.length) {
        showEmpty(`Say hello to ${selectedContact}!`);
        return;
    }

    conversation.forEach(message => {
        const mine = message.sender === username;

        const row = document.createElement("div");
        row.className = "message-row" + (mine ? " mine" : "");

        const bubble = document.createElement("div");
        bubble.className = "bubble" + (mine ? " mine" : "");

        const author = document.createElement("div");
        author.className = "author";
        author.textContent = mine ? "You" : message.sender;

        const text = document.createElement("div");
        if (message.message_type === "image") {
    const img = document.createElement("img");
img.style.cursor = "zoom-in";
img.onclick = () => openImage(message.message);
    img.src = message.message;
    img.alt = "Shared image";
    img.style.maxWidth = "260px";
    img.style.maxHeight = "260px";
    img.style.borderRadius = "8px";
    img.style.display = "block";
    text.appendChild(img);
} else {
    text.textContent = message.message;
}

        const time = document.createElement("span");
        time.className = "message-time";

        if (message.timestamp) {
            const value = message.timestamp;
            const date = new Date(
                value.includes("T")
                    ? value
                    : value.replace(" ", "T") + "Z"
            );

            time.textContent = Number.isNaN(date.getTime())
                ? ""
                : date.toLocaleTimeString([], {
                    hour: "2-digit",
                    minute: "2-digit"
                });
        }

        const deleteButton = document.createElement("button");
deleteButton.textContent = "🗑️";
deleteButton.title = "Delete message";
deleteButton.style.padding = "4px";
deleteButton.style.marginTop = "5px";
deleteButton.style.background = "transparent";
deleteButton.style.color = "#555";

deleteButton.onclick = () => {
    const choice = prompt(
        "Type 'me' to delete for yourself, or 'everyone' to delete for everyone (your own messages only)."
    ).trim().toLowerCase();

    if (choice !== "me" && choice !== "everyone") return;

    if (choice === "everyone" && message.sender !== username) {
        alert("You can only delete your own messages for everyone.");
        return;
    }

    socket.send(JSON.stringify({
        action: "delete",
        id: message.id,
        scope: choice
    }));
};

bubble.append(author, text, time, deleteButton);
        row.appendChild(bubble);
        container.appendChild(row);
    });

    container.scrollTop = container.scrollHeight;
}

function showEmpty(text) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = text;
    $("messages").appendChild(p);
}

function updateInputState() {
    const enabled = socket &&
        socket.readyState === WebSocket.OPEN &&
        Boolean(selectedContact || selectedGroup);

    $("message").disabled = !enabled;
    $("imageButton").disabled = !enabled;
    $("sendButton").disabled = !enabled;
}

function sendMessage() {
    if (!socket || socket.readyState !== WebSocket.OPEN) {
        alert("You are not connected.");
        return;
    }

    const input = $("message");
    const message = input.value.trim();

    if (!message) return;

    if (selectedGroup) {
        socket.send(JSON.stringify({
            action: "group_message",
            group_id: selectedGroup.id,
            message: message
        }));
    } else if (selectedContact) {
        socket.send(JSON.stringify({
            recipient: selectedContact,
            message: message
        }));
    } else {
        alert("Select a conversation first.");
        return;
    }

    input.value = "";
    input.focus();
}

function sendImage() {
    const input = $("imageFile");
    const file = input.files[0];

    if (!file) return;

    if (!socket || socket.readyState !== WebSocket.OPEN ||
    (!selectedContact && !selectedGroup)) {
    alert("Connect and select a conversation first.");
    input.value = "";
    return;
}

    const allowedTypes = [
        "image/jpeg",
        "image/png",
        "image/webp",
        "image/gif"
    ];

    if (!allowedTypes.includes(file.type)) {
        alert("Choose a JPG, PNG, WEBP, or GIF image.");
        input.value = "";
        return;
    }

    if (file.size > 1024 * 1024) {
        alert("Image must be 1 MB or smaller.");
        input.value = "";
        return;
    }

    const reader = new FileReader();

    reader.onload = () => {
    if (selectedGroup) {
        socket.send(JSON.stringify({
            action: "group_message",
            group_id: selectedGroup.id,
            message: reader.result,
            message_type: "image"
        }));
    } else {
        socket.send(JSON.stringify({
            recipient: selectedContact,
            message: reader.result,
            message_type: "image"
        }));
    }

    input.value = "";
};

    reader.onerror = () => {
        alert("Could not read the image.");
        input.value = "";
    };

    reader.readAsDataURL(file);
}

function handleEnter(event) {
    if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        sendMessage();
    }
}

async function logout() {
    if (socket) socket.close();

    await fetch("/api/logout", { method: "POST" });

    username = "";
    selectedContact = "";
    historyMessages = [];
    contacts = [];

    $("chatView").hidden = true;
    $("authView").hidden = false;
    $("authPassword").value = "";
    $("authStatus").textContent = "You have logged out.";
}

// Restore a valid session after a page refresh
async function restoreSession() {
    try {
        const response = await fetch("/api/me");

        if (response.ok) {
            const data = await response.json();
            enterChat(data.username);
        }
    } catch {
        // The login screen remains visible.
    }
}

restoreSession();
</script>
